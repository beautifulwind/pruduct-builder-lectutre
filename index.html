<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 깜빡임 방지: 렌더링 전에 저장된 테마 적용
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --button-bg: #f0f0f0;
            --button-text: #1a1a1a;
            --button-border: #d0d0d0;
        }
        :root[data-theme="dark"] {
            --bg: #121212;
            --text: #f0f0f0;
            --button-bg: #2a2a2a;
            --button-text: #f0f0f0;
            --button-border: #444444;
        }
        body {
            margin: 0;
            padding: 16px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            transition: background 0.2s, color 0.2s;
        }
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 8px 14px;
            border: 1px solid var(--button-border);
            border-radius: 8px;
            background: var(--button-bg);
            color: var(--button-text);
            font-size: 14px;
            cursor: pointer;
        }
        .contact {
            max-width: 480px;
            margin: 40px auto 0;
        }
        .contact label {
            display: block;
            margin: 16px 0 6px;
            font-size: 14px;
            font-weight: 600;
        }
        .contact input,
        .contact textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--button-border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font: inherit;
        }
        .contact textarea {
            min-height: 140px;
            resize: vertical;
        }
        .contact button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: 1px solid var(--button-border);
            border-radius: 8px;
            background: var(--text);
            color: var(--bg);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        .contact button:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .form-status {
            margin-top: 12px;
            font-size: 14px;
        }
        .comments {
            max-width: 720px;
            margin: 80px auto 0;
            padding-top: 32px;
            border-top: 1px solid var(--button-border);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" type="button"></button>
    <h1>안녕하세요</h1>

    <section class="contact">
        <h2>제휴 문의</h2>
        <form id="contactForm" action="https://formspree.io/f/xyeewbjn" method="POST">
            <label for="name">이름 / 회사명</label>
            <input id="name" name="name" type="text" required>

            <label for="email">이메일</label>
            <input id="email" name="email" type="email" required>

            <label for="message">문의 내용</label>
            <textarea id="message" name="message" required></textarea>

            <input type="hidden" name="_subject" value="새 제휴 문의">
            <button type="submit">문의 보내기</button>
            <p class="form-status" id="formStatus" role="status"></p>
        </form>
    </section>

    <script>
        var form = document.getElementById('contactForm');
        var formStatus = document.getElementById('formStatus');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var submit = form.querySelector('button[type="submit"]');
            submit.disabled = true;
            formStatus.textContent = '보내는 중...';

            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            }).then(function (res) {
                if (!res.ok) throw new Error();
                form.reset();
                formStatus.textContent = '문의가 접수되었습니다. 빠르게 연락드리겠습니다.';
            }).catch(function () {
                formStatus.textContent = '전송에 실패했습니다. 잠시 후 다시 시도해 주세요.';
            }).finally(function () {
                submit.disabled = false;
            });
        });
    </script>

    <script>
        var toggle = document.getElementById('themeToggle');

        function render() {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            toggle.textContent = isDark ? '☀️ 라이트 모드' : '🌙 다크 모드';
            toggle.setAttribute('aria-label', isDark ? '라이트 모드로 전환' : '다크 모드로 전환');
        }

        toggle.addEventListener('click', function () {
            var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            render();
            // Disqus는 로드 시점의 배경색으로 테마를 정하므로, 전환이 끝난 뒤 다시 불러온다
            if (window.DISQUS) {
                setTimeout(function () {
                    DISQUS.reset({ reload: true, config: disqus_config });
                }, 250);
            }
        });

        render();
    </script>

    <section class="comments">
        <h2>댓글</h2>
        <div id="disqus_thread"></div>
        <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
    </section>

    <script>
        var disqus_config = function () {
            this.page.url = location.origin + location.pathname;
            this.page.identifier = location.pathname;
        };
        (function () {
            var d = document, s = d.createElement('script');
            s.src = 'https://productbuilder-jjmayjcvqs.disqus.com/embed.js';
            s.setAttribute('data-timestamp', +new Date());
            (d.head || d.body).appendChild(s);
        })();
    </script>
</body>
</html>
